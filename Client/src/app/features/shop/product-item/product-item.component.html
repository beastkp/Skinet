@if (product) {
   <mat-card
      appearance="outlined"
      class="!rounded-xl !shadow-sm !border !border-slate-200 overflow-hidden flex flex-col hover:!shadow-md transition-shadow"
    >
      <img mat-card-image [src]="product.pictureUrl" [alt]="product.name" class="!m-0 w-full h-44 object-cover" />

      <div class="p-4 flex flex-col flex-1">
        <h3 class="font-medium text-slate-900">{{ product.name }}</h3>
        <p class="text-xs text-slate-500 mt-0.5">{{ product.type }}</p>
        <p class="text-sm text-slate-600 mt-2 flex-1">{{ product.description }}</p>

        <div class="flex items-center justify-between mt-4">
          <span class="font-semibold text-slate-900">{{ product.price | currency:'INR' }}</span>
          <span
            class="text-xs font-medium px-2 py-1 rounded-full"
            [class.bg-emerald-50]="product.quantityInStock"
            [class.text-emerald-700]="product.quantityInStock"
            [class.bg-red-50]="!product.quantityInStock"
            [class.text-red-700]="!product.quantityInStock"
          >
            {{ product.quantityInStock > 0 ? 'In stock' : 'Out of stock' }}
          </span>
        </div>

        <button
          mat-flat-button
          [disabled]="!product.quantityInStock"
          (click)="addToCart(product)"
          class="!mt-3 !w-full !rounded-lg"
        >
          <mat-icon>shopping_cart</mat-icon>
          Add to cart
        </button>
      </div>
    </mat-card>
}
