<div class="flex flex-col gap-3">
  <div class="flex justify-end">
    <button mat-stroked-button color="primary" (click)="openFiltersDialog()">
      <mat-icon>filter_list</mat-icon>
      Filters
    </button>
  </div>
  <!-- product-list.component.html -->
  <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
    @for (product of products(); track product.id) {
      <app-product-item [product]="product"></app-product-item>
    } @empty {
      <p class="col-span-full text-center text-slate-400">No products available.</p>
    }
  </div>
</div>
