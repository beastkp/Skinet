<header class="app-header w-full sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-(--app-border-subtle)">
  <div class="flex items-center justify-between max-w-screen-2xl mx-auto px-4 sm:px-6 h-(--app-header-height)">

    <img routerLink="/" src="/images/logo.png" alt="app logo" class="h-10 sm:h-12 w-auto">

    <nav class="hidden md:flex gap-8 text-sm font-medium tracking-wide uppercase">
      <a routerLink="/" routerLinkActive="active" class="app-nav-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/shop" routerLinkActive="active" class="app-nav-link">Shop</a>
      <a routerLink="/test-error" routerLinkActive="active"  class="app-nav-link">Errors</a>
    </nav>

    <div class="flex items-center gap-4">
      <a routerLink="/cart" routerLinkActive="active" matBadge="{{cartService.itemCount()}}" matBadgeSize="medium" class="custom-badge relative inline-flex" aria-label="Cart, 5 items">
        <mat-icon>shopping_cart</mat-icon>
      </a>
      @if(accountService.currentUser()){
        <button mat-button routerLink="/account/login" color="primary" [matMenuTriggerFor]="menu">
          <mat-icon>arrow_drop_down</mat-icon>
          <span>{{accountService.currentUser()?.email}}</span>
        </button>
      }@else {
        <button mat-stroked-button routerLink="/account/login">Login</button>
        <button mat-flat-button color="primary" routerLink="/account/register" class="hidden sm:inline-flex">Register</button>
      }
    </div>  

  </div>
</header>

@if(busyService.loading()){
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<mat-menu #menu="matMenu" class="px-3">
  <button mat-menu-item class="px-3" routerLink="/cart">
    <mat-icon>shopping_cart</mat-icon>
    My cart
  </button>
  <button mat-menu-item class="px-3" routerLink="/orders">
    <mat-icon>history</mat-icon>
    My orders
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item class="px-3" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</mat-menu>
