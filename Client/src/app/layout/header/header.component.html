<header class="app-header w-full sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-(--app-border-subtle)">
  <div class="flex items-center justify-between max-w-screen-2xl mx-auto px-4 sm:px-6 h-(--app-header-height)">

    <img routerLink="/" src="/images/logo.png" alt="app logo" class="h-10 sm:h-12 w-auto">

    <nav class="hidden md:flex gap-8 text-sm font-medium tracking-wide uppercase">
      <a routerLink="/" routerLinkActive="active" class="app-nav-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/shop" routerLinkActive="active" class="app-nav-link">Shop</a>
      <a routerLink="/test-error" routerLinkActive="active"  class="app-nav-link">Errors</a>
    </nav>

    <div class="flex items-center gap-4">
      <a routerLink="/cart" routerLinkActive="active" matBadge="{{cartService.itemCount()}}" matBadgeSize="medium" class="custom-badge relative inline-flex" aria-label="Cart, 5 items">
        <mat-icon>shopping_cart</mat-icon>
      </a>
      <button mat-stroked-button color="primary">Login</button>
      <button mat-flat-button color="primary" class="hidden sm:inline-flex">Sign Up</button>
    </div>  

  </div>
</header>

@if(busyService.loading()){
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}
